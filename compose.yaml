services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_USER: nomi
      POSTGRES_PASSWORD: nomi_local
      POSTGRES_DB: nomi
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["nomi_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomi -d nomi"]
      interval: 5s
      retries: 10
volumes:
  nomi_pg:
