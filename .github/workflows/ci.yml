name: Core checks
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci && npm run mobile:sync
      - name: APK and native unit tests
        working-directory: apps/mobile/android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: nomi-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: apps/mobile/android/app/build/reports/tests/
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nomi
          POSTGRES_PASSWORD: nomi_local
          POSTGRES_DB: nomi_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U nomi -d nomi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nomi:nomi_local@127.0.0.1:54329/nomi_test
      TEST_DATABASE_URL: postgresql+psycopg://nomi:nomi_local@127.0.0.1:54329/nomi_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m ruff check apps/api scripts && python -m ruff format --check apps/api scripts
      - run: python -m pytest -q
      - run: python -m alembic check
      - name: Security checks
        run: |
          python -m venv .local/security-tools
          .local/security-tools/bin/pip install -r requirements-security.txt
          .local/security-tools/bin/python -m pip_audit -r requirements.lock --no-deps --disable-pip
          .local/security-tools/bin/python -m bandit -r apps/api/app -q
          .local/security-tools/bin/python scripts/check_secrets.py
      - run: npm ci && npm run typecheck && npm run build
      - run: npm audit --audit-level=low
      - run: python scripts/export_openapi.py && npx openapi-typescript docs/api/openapi.json -o apps/web/src/lib/schema.d.ts && git diff --exit-code -- docs/api/openapi.json apps/web/src/lib/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
